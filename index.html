<!-- FULL index.html replacement -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Echo Black Visual Pack</title>
<style>
body{
  background:#0a0c07;
  color:#e8dfc0;
  font-family:Arial,sans-serif;
  padding:20px;
}
.panel{
  border:1px solid #3d4a20;
  padding:16px;
  margin-top:12px;
  background:#111408;
}
button{
  padding:10px;
  margin:4px;
}
textarea,input,select{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:#161a0d;
  color:white;
  border:1px solid #3d4a20;
}
</style>
</head>
<body>

<h1>Echo Black</h1>

<input id="topic" placeholder="Enter topic">

<select id="mode">
<option value="episode_pack">Episode Pack</option>
<option value="shorts_pack">Shorts Pack</option>
<option value="hook_storm">Hook Storm</option>
</select>

<textarea id="notes" rows="4" placeholder="Optional notes"></textarea>

<button id="generateBtn">Generate Pack</button>
<button id="saveBtn">Save Pack</button>

<div id="result"></div>

<div class="panel">
<h2>Saved Packs</h2>
<div id="savedPacks"></div>
</div>

<script>
const result = document.getElementById('result');
const savedPacks = document.getElementById('savedPacks');

async function generatePack(){
  const topic = document.getElementById('topic').value;
  const mode = document.getElementById('mode').value;
  const notes = document.getElementById('notes').value;

  const response = await fetch('/api/generate-pack',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({topic,mode,notes})
  });

  const data = await response.json();

  result.innerHTML = `
    <div class="panel">
      <h2>Titles</h2>
      <pre>${JSON.stringify(data.payload.titles,null,2)}</pre>

      <h2>Graphics Prompts</h2>
      <pre>${JSON.stringify(data.payload.graphics_prompts,null,2)}</pre>

      <h2>B-roll Ideas</h2>
      <pre>${JSON.stringify(data.payload.broll_ideas,null,2)}</pre>

      <h2>Shot List</h2>
      <pre>${JSON.stringify(data.payload.shot_list,null,2)}</pre>

      <h2>Research Checklist</h2>
      <pre>${JSON.stringify(data.payload.research_checklist,null,2)}</pre>
    </div>
  `;

  window.currentPack = data;
}

function savePack(){
  if(!window.currentPack) return;

  const packs = JSON.parse(localStorage.getItem('echo_black_saved_packs') || '[]');

  packs.unshift(window.currentPack);

  localStorage.setItem(
    'echo_black_saved_packs',
    JSON.stringify(packs)
  );

  loadSavedPacks();
}

function loadSavedPacks(){
  const packs = JSON.parse(localStorage.getItem('echo_black_saved_packs') || '[]');

  savedPacks.innerHTML = packs.map((p,i)=>`
    <div class="panel">
      <strong>${p.topic}</strong>
      <br>
      <button onclick="openPack(${i})">Open</button>
      <button onclick="deletePack(${i})">Delete</button>
    </div>
  `).join('');
}

function openPack(i){
  const packs = JSON.parse(localStorage.getItem('echo_black_saved_packs') || '[]');
  result.innerHTML = '<pre>'+JSON.stringify(packs[i],null,2)+'</pre>';
}

function deletePack(i){
  const packs = JSON.parse(localStorage.getItem('echo_black_saved_packs') || '[]');
  packs.splice(i,1);
  localStorage.setItem('echo_black_saved_packs',JSON.stringify(packs));
  loadSavedPacks();
}

document.getElementById('generateBtn').onclick = generatePack;
document.getElementById('saveBtn').onclick = savePack;

loadSavedPacks();
</script>

</body>
</html>
